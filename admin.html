<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Admin - SaaS Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #111827; --accent: #10b981; }
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; padding: 12px 24px; width: 100%; }
        .btn-save { background: var(--accent); color: white; padding: 16px; position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .item-row { display: flex; gap: 15px; background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 10px; align-items: center; }
        .preview-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #eee; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Auth Section -->
    <div id="auth-section" class="card">
        <h2>Partner Login / Sign Up</h2>
        <p>Create an account to start your digital menu.</p>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-main" onclick="handleAuth()">Login or Register</button>
    </div>

    <!-- Main Admin Panel -->
    <div id="admin-panel" class="hidden">
        <div class="nav">
            <h2 id="welcome-msg">Dashboard</h2>
            <button onclick="logout()" style="color: #ef4444; background: none;">Logout</button>
        </div>

        <div class="card">
            <h3>Shop Branding</h3>
            <label>Restaurant Name</label>
            <input type="text" id="res-name" placeholder="e.g. Blue Bottle Coffee">
            <label>Logo Upload</label>
            <input type="file" id="res-logo-file" accept="image/*">
            <div id="logo-preview-container"></div>
        </div>

        <div id="menu-builder"></div>
        <button class="btn-main" style="background: #374151; margin-top: 10px;" onclick="addCategory()">+ Add New Category</button>
    </div>
</div>

<button id="save-btn" class="btn-save hidden" onclick="saveAll()">Save & Publish Menu</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // --- PASTE YOUR FIREBASE CONFIG HERE ---
    const firebaseConfig = {
  apiKey: "AIzaSyDrS3qQrsUX9uZ2feirxypuuZAOr8PNGtI",
  authDomain: "cofee-shop-26e73.firebaseapp.com",
  projectId: "cofee-shop-26e73",
  storageBucket: "cofee-shop-26e73.firebasestorage.app",
  messagingSenderId: "1078896374249",
  appId: "1:1078896374249:web:e633362be7cca4a9479b78",
  measurementId: "G-KLGNXCJXBG"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUID = null;
    let menuData = { categories: [] };

    // AUTH LOGIC
    window.handleAuth = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) {
            if (err.code === 'auth/user-not-found') {
                await createUserWithEmailAndPassword(auth, email, pass);
            } else { alert(err.message); }
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUID = user.uid;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('save-btn').classList.remove('hidden');
            loadExistingData();
        } else {
            location.reload();
        }
    });

    window.logout = () => signOut(auth);

    // IMAGE UPLOAD LOGIC
    async function uploadFile(file, path) {
        if (!file) return null;
        const storageRef = ref(storage, `restaurants/${currentUID}/${path}_${Date.now()}`);
        const snapshot = await uploadBytes(storageRef, file);
        return await getDownloadURL(snapshot.ref);
    }

    async function loadExistingData() {
        const docRef = doc(db, "restaurants", currentUID);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('res-name').value = data.name || "";
            menuData.categories = data.categories || [];
            renderMenuEditor();
        }
    }

    window.addCategory = () => {
        menuData.categories.push({ name: "New Category", items: [] });
        renderMenuEditor();
    };

    window.addItem = (catIdx) => {
        menuData.categories[catIdx].items.push({ name: "", price: "", desc: "", img: "" });
        renderMenuEditor();
    };

    function renderMenuEditor() {
        const container = document.getElementById('menu-builder');
        container.innerHTML = '';
        menuData.categories.forEach((cat, cIdx) => {
            let html = `<div class="card">
                <input type="text" value="${cat.name}" onchange="updateCatName(${cIdx}, this.value)" style="font-weight:bold; font-size:1.2rem">
                <div id="items-${cIdx}">`;
            
            cat.items.forEach((item, iIdx) => {
                html += `<div class="item-row">
                    <img src="${item.img || 'https://via.placeholder.com/60'}" class="preview-img">
                    <div style="flex:1">
                        <input type="text" placeholder="Item Name" value="${item.name}" onchange="updateItem(${cIdx}, ${iIdx}, 'name', this.value)">
                        <input type="text" placeholder="Price" value="${item.price}" onchange="updateItem(${cIdx}, ${iIdx}, 'price', this.value)">
                        <input type="file" accept="image/*" onchange="uploadItemImg(${cIdx}, ${iIdx}, this)">
                    </div>
                </div>`;
            });
            
            html += `</div><button onclick="addItem(${cIdx})">+ Add Item</button></div>`;
            container.innerHTML += html;
        });
    }

    window.updateCatName = (i, val) => menuData.categories[i].name = val;
    window.updateItem = (c, i, field, val) => menuData.categories[c].items[i][field] = val;
    
    window.uploadItemImg = async (c, i, input) => {
        const url = await uploadFile(input.files[0], `item_${c}_${i}`);
        if(url) {
            menuData.categories[c].items[i].img = url;
            renderMenuEditor();
        }
    };

    window.saveAll = async () => {
        const name = document.getElementById('res-name').value;
        const logoFile = document.getElementById('res-logo-file').files[0];
        let logoUrl = null;
        
        if (logoFile) logoUrl = await uploadFile(logoFile, 'logo');
        
        const payload = {
            name: name,
            categories: menuData.categories,
            updatedAt: new Date()
        };
        if (logoUrl) payload.logo = logoUrl;

        await setDoc(doc(db, "restaurants", currentUID), payload, { merge: true });
        alert("Published! Your Public ID is: " + currentUID);
    };
</script>
</body>
</html>
