<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #111827; --accent: #10b981; }
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; max-width: 600px; margin: auto; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; padding: 12px; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; width: 100%; }
        .btn-save { background: var(--accent); color: white; position: fixed; bottom: 20px; right: 20px; padding: 15px 30px; z-index: 1000; }
        .item-box { background: #f9fafb; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

<div id="auth-container" class="card">
    <h2>Partner Sign Up / Login</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button class="btn-main" id="auth-btn">Start My Menu</button>
</div>

<div id="admin-panel" class="hidden">
    <div class="card">
        <h3>Shop Details</h3>
        <input type="text" id="res-name" placeholder="Restaurant Name">
        <input type="text" id="res-logo" placeholder="Logo Image URL">
    </div>
    <div id="categories-container"></div>
    <button onclick="addCategory()" style="background: #374151; color: white; margin-bottom: 100px;">+ Add Category</button>
</div>

<button id="save-btn" class="btn-save hidden">Publish Changes</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDrS3qQrsUX9uZ2feirxypuuZAOr8PNGtI",
        authDomain: "cofee-shop-26e73.firebaseapp.com",
        projectId: "cofee-shop-26e73",
        storageBucket: "cofee-shop-26e73.firebasestorage.app",
        messagingSenderId: "1078896374249",
        appId: "1:1078896374249:web:e633362be7cca4a9479b78",
        measurementId: "G-KLGNXCJXBG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUID = null;
    let menuData = { categories: [] };

    document.getElementById('auth-btn').onclick = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (e) {
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
            } catch (err) { alert(err.message); }
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUID = user.uid;
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('save-btn').classList.remove('hidden');
            loadMenu();
        }
    });

    window.addCategory = () => {
        menuData.categories.push({ name: "New Category", items: [] });
        render();
    };

    window.addItem = (idx) => {
        menuData.categories[idx].items.push({ name: "", price: "", img: "" });
        render();
    };

    function render() {
        const container = document.getElementById('categories-container');
        container.innerHTML = '';
        menuData.categories.forEach((cat, cIdx) => {
            let html = `<div class="card">
                <input type="text" value="${cat.name}" onchange="menuData.categories[${cIdx}].name=this.value">
                <div id="items-${cIdx}">`;
            cat.items.forEach((item, iIdx) => {
                html += `<div class="item-box">
                    <input type="text" placeholder="Item Name" value="${item.name}" onchange="menuData.categories[${cIdx}].items[${iIdx}].name=this.value">
                    <input type="text" placeholder="Price" value="${item.price}" onchange="menuData.categories[${cIdx}].items[${iIdx}].price=this.value">
                    <input type="text" placeholder="Image URL" value="${item.img}" onchange="menuData.categories[${cIdx}].items[${iIdx}].img=this.value">
                </div>`;
            });
            html += `</div><button onclick="addItem(${cIdx})">+ Add Item</button></div>`;
            container.innerHTML += html;
        });
    }

    document.getElementById('save-btn').onclick = async () => {
    const btn = document.getElementById('save-btn');
    btn.innerText = "Publishing...";
    
    const payload = {
        name: document.getElementById('res-name').value,
        logo: document.getElementById('res-logo').value,
        categories: menuData.categories
    };

    try {
        await setDoc(doc(db, "restaurants", currentUID), payload);
        
        // AUTO-GENERATE THE LINK FOR THEM
        const liveLink = window.location.href.replace('admin.html', 'menu.html') + "?id=" + currentUID;
        
        alert("✅ Success! Your Menu is live at:\n\n" + liveLink);
        console.log("Customer Link:", liveLink);
        
    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        btn.innerText = "Publish Changes";
    }
};
    async function loadMenu() {
        const snap = await getDoc(doc(db, "restaurants", currentUID));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('res-name').value = data.name || "";
            document.getElementById('res-logo').value = data.logo || "";
            menuData.categories = data.categories || [];
            render();
        }
    }
</script>
</body>
</html>
