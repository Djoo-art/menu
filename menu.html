<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body { font-family: sans-serif; margin: 0; text-align: center; }
        .header { background: #111; color: #fff; padding: 40px; }
        .logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; max-width: 500px; margin: auto; }
        .item img { width: 60px; height: 60px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="content">Loading...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* SAME CONFIG AS ADMIN */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (id) {
            const docSnap = await getDoc(doc(db, "restaurants", id));
            if (docSnap.exists()) {
                const data = docSnap.data();
                let html = `<div class="header">
                    ${data.logo ? `<img src="${data.logo}" class="logo">` : ''}
                    <h1>${data.name}</h1>
                </div>`;
                data.categories.forEach(cat => {
                    html += `<h3>${cat.name}</h3>`;
                    cat.items.forEach(item => {
                        html += `<div class="item">
                            <div><b>${item.name}</b></div>
                            <div>${item.price}</div>
                            ${item.img ? `<img src="${item.img}">` : ''}
                        </div>`;
                    });
                });
                document.getElementById('content').innerHTML = html;
            }
        }
    </script>
</body>
</html>
