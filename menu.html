<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #10b981; --dark: #111827; --gray: #f3f4f6; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: var(--gray); color: var(--dark); }
        .hero { background: var(--dark); padding: 60px 20px; text-align: center; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; margin-bottom: 15px; background: white; }
        .container { max-width: 600px; margin: -30px auto 0; padding: 0 15px 50px; }
        .cat-title { font-size: 1.2rem; font-weight: 800; margin: 40px 0 15px; display: flex; align-items: center; gap: 10px; }
        .cat-title::after { content: ''; flex: 1; height: 1px; background: #cbd5e1; }
        .item-card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 12px; display: flex; gap: 15px; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .item-img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; background: #eee; }
        .item-info { flex: 1; }
        .item-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 2px; display: block; }
        .item-price { color: var(--accent); font-weight: 800; }
        #loader { display: flex; height: 100vh; justify-content: center; align-items: center; font-weight: 700; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loader">Loading...</div>
    <div id="content" class="hidden">
        <div class="hero">
            <div id="logo-box"></div>
            <h1 id="res-name" style="margin:0"></h1>
        </div>
        <div class="container" id="list"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDrS3qQrsUX9uZ2feirxypuuZAOr8PNGtI",
        authDomain: "cofee-shop-26e73.firebaseapp.com",
        projectId: "cofee-shop-26e73",
        storageBucket: "cofee-shop-26e73.firebasestorage.app",
        messagingSenderId: "1078896374249",
        appId: "1:1078896374249:web:e633362be7cca4a9479b78"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function load() {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) return;
        const snap = await getDoc(doc(db, "restaurants", id));
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            document.getElementById('res-name').innerText = data.name || "Menu";
            if(data.logo) document.getElementById('logo-box').innerHTML = `<img src="${data.logo}" class="logo">`;
            
            const list = document.getElementById('list');
            data.categories.forEach(cat => {
                let html = `<div class="cat-title">${cat.name}</div>`;
                cat.items.forEach(item => {
                    if(item.name) {
                        html += `<div class="item-card">
                            ${item.img ? `<img src="${item.img}" class="item-img">` : ''}
                            <div class="item-info">
                                <span class="item-name">${item.name}</span>
                                <span class="item-price">${item.price}</span>
                            </div>
                        </div>`;
                    }
                });
                list.innerHTML += html;
            });
        }
    }
    load();
</script>
</body>
</html>
