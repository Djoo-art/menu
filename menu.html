<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background: #fff; color: #111; }
        .header { text-align: center; padding: 40px 20px; background: #111; color: #fff; }
        .logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #fff; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .category-title { font-size: 1.5rem; font-weight: 800; margin: 30px 0 15px; border-bottom: 2px solid #111; padding-bottom: 5px; }
        .item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .item-img { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; }
        .item-info { flex: 1; }
        .item-name { font-weight: 700; font-size: 1.1rem; }
        .item-price { font-weight: 800; background: #f3f4f6; padding: 2px 8px; border-radius: 6px; }
        #loading { text-align: center; margin-top: 100px; font-weight: 600; }
    </style>
</head>
<body>

<div id="loading">Loading Menu...</div>

<div id="menu-content" class="hidden">
    <div class="header">
        <div id="logo-holder"></div>
        <h1 id="shop-name"></h1>
    </div>
    <div class="container" id="menu-list"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrS3qQrsUX9uZ2feirxypuuZAOr8PNGtI",
      authDomain: "cofee-shop-26e73.firebaseapp.com",
      projectId: "cofee-shop-26e73",
      storageBucket: "cofee-shop-26e73.firebasestorage.app",
      messagingSenderId: "1078896374249",
      appId: "1:1078896374249:web:e633362be7cca4a9479b78",
      measurementId: "G-KLGNXCJXBG"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadMenu() {
        const params = new URLSearchParams(window.location.search);
        const resId = params.get('id');

        if (!resId) {
            document.body.innerHTML = "<h1>No Restaurant ID provided.</h1>";
            return;
        }

        const docRef = doc(db, "restaurants", resId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('shop-name').innerText = data.name;
            
            if (data.logo) {
                document.getElementById('logo-holder').innerHTML = `<img src="${data.logo}" class="logo">`;
            }

            const list = document.getElementById('menu-list');
            data.categories.forEach(cat => {
                let html = `<div class="category-title">${cat.name}</div>`;
                cat.items.forEach(item => {
                    html += `
                        <div class="item">
                            ${item.img ? `<img src="${item.img}" class="item-img">` : ''}
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div style="color: #666; font-size: 0.9rem">${item.desc || ''}</div>
                            </div>
                            <div class="item-price">${item.price}</div>
                        </div>
                    `;
                });
                list.innerHTML += html;
            });
        } else {
            document.body.innerHTML = "<h1>Menu not found.</h1>";
        }
    }

    loadMenu();
</script>
</body>
</html>
